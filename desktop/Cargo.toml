[package]
name = "ReAmped"
version = "1.2.2"
edition = "2024"

[features]
default = ["bit-perfect-backend"]
bit-perfect-backend = ["player_core/bit-perfect-backend"]

[dependencies]
dirs-next = "2.0.0"
eframe = "0.33.3"
egui = "0.33.3"
image = "0.25.9"
infer = "0.15.0"
material-color-utilities = { version = "1.0.0-dev.18", features = ["serde"] }
num-complex = "0.4.6"
player_core = { path = "../player-core/" }
rfd = "0.17.2"
serde = "1.0.228"
serde_json = "1.0.132"
toml = "1.0.2"
walkdir = "2.5.0"

[target.'cfg(target_os = "linux")'.dependencies]
async-channel = "2.5.0"
async-std = { version = "1.13.2", features = ["unstable"] }
mpris-server = "0.10.0"

[package]
name = "player_core"
version = "0.3.1"
edition = "2024"

[features]
default = ["symphonia-backend"]
symphonia-backend = []
c-ffi = []

[dependencies]
lofty = "0.24.0"
num-complex = "0.4.6"
rustfft = "6.4.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
symphonia = { version = "0.5.5", features = ["all-codecs", "all-formats"] }
cpal = "0.17.1"
rubato = "1.0.1"
audioadapter-buffers = "2.0.0"
ringbuf = "0.2.5"
rand = "0.10.1"
dirs-next = "2.0.0"
toml = "1.0.2"
atomic_float = "1.1.0"
